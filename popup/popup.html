<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="extName">KoalaSnap - 考拉易截</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="icon-wrapper">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </div>
      <h1 class="title" data-i18n="extShortName">KoalaSnap</h1>
      <p class="subtitle" data-i18n="uiSubtitle">考拉易截 · 选择截图模式</p>
    </div>

    <!-- Screenshot Modes -->
    <div class="modes">
      <button class="mode-btn" id="captureVisible">
        <div class="mode-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <div class="mode-content">
          <h3 class="mode-title" data-i18n="modeVisibleTitle">可见区域</h3>
          <p class="mode-desc" data-i18n="modeVisibleDesc">截取当前屏幕可见内容</p>
        </div>
        <div class="mode-badge">
          <span class="badge" data-i18n="badgeFast">快捷</span>
        </div>
      </button>

      <button class="mode-btn" id="captureFullPage">
        <div class="mode-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
        </div>
        <div class="mode-content">
          <h3 class="mode-title" data-i18n="modeFullTitle">整页截图</h3>
          <p class="mode-desc" data-i18n="modeFullDesc">自动滚动并拼接长图</p>
        </div>
        <div class="mode-badge">
          <span class="badge badge-pro" data-i18n="badgePro">长图</span>
        </div>
      </button>

      <button class="mode-btn" id="captureArea">
        <div class="mode-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </div>
        <div class="mode-content">
          <h3 class="mode-title" data-i18n="modeAreaTitle">区域选择</h3>
          <p class="mode-desc" data-i18n="modeAreaDesc">自由选择截图区域</p>
        </div>
        <div class="mode-badge">
          <span class="badge badge-custom" data-i18n="badgeCustom">自定义</span>
        </div>
      </button>
    </div>

    <!-- Progress Indicator -->
    <div class="progress-container" id="progressContainer" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText" data-i18n="progressCapturing">正在截图...</p>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="shortcut-hint">
        <svg class="shortcut-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z">
          </path>
        </svg>
        <span><span data-i18n="shortcutText">快捷键:</span> <kbd>Ctrl+Shift+S</kbd></span>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>

</html>
